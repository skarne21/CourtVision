<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      width: 200px;
      margin: 0;
    }
    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 4px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h2>CourtVision Settings</h2>
  <label for="bankroll">Bankroll ($)</label>
  <input type="number" id="bankroll" placeholder="e.g. 1000" min="0" step="10">
  <script src="popup.js"></script>
</body>
</html>
